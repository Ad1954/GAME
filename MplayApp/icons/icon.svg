<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a" />
      <stop offset="50%" stop-color="#181c2b" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2439" />
      <stop offset="100%" stop-color="#121521" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#f43f5e" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Outer Film Frame Border -->
  <rect x="44" y="64" width="424" height="384" rx="36" fill="none" stroke="url(#frameGrad)" stroke-width="6" opacity="0.85" />

  <!-- Film Strip Base Body -->
  <rect x="52" y="72" width="408" height="368" rx="30" fill="#0d0f17" />

  <!-- Top Film Sprocket Holes (底片齒孔 - 上排) -->
  <g fill="url(#frameGrad)" opacity="0.9">
    <rect x="80"  y="90" width="32" height="22" rx="6" />
    <rect x="136" y="90" width="32" height="22" rx="6" />
    <rect x="192" y="90" width="32" height="22" rx="6" />
    <rect x="248" y="90" width="32" height="22" rx="6" />
    <rect x="304" y="90" width="32" height="22" rx="6" />
    <rect x="360" y="90" width="32" height="22" rx="6" />
    <rect x="408" y="90" width="24" height="22" rx="6" />
  </g>

  <!-- Bottom Film Sprocket Holes (底片齒孔 - 下排) -->
  <g fill="url(#frameGrad)" opacity="0.9">
    <rect x="80"  y="400" width="32" height="22" rx="6" />
    <rect x="136" y="400" width="32" height="22" rx="6" />
    <rect x="192" y="400" width="32" height="22" rx="6" />
    <rect x="248" y="400" width="32" height="22" rx="6" />
    <rect x="304" y="400" width="32" height="22" rx="6" />
    <rect x="360" y="400" width="32" height="22" rx="6" />
    <rect x="408" y="400" width="24" height="22" rx="6" />
  </g>

  <!-- Center Main Film Frame Viewport (主底片影格視窗) -->
  <rect x="88" y="130" width="336" height="252" rx="20" fill="url(#screenGrad)" stroke="#2e3654" stroke-width="3" />

  <!-- Side Neighbor Film Frame Hints (左右相鄰影格視覺暗示) -->
  <rect x="52" y="138" width="22" height="236" rx="6" fill="#181c2c" opacity="0.7" />
  <rect x="438" y="138" width="22" height="236" rx="6" fill="#181c2c" opacity="0.7" />

  <!-- Subtle Horizon / Image Mountain Silhouette inside Film Frame -->
  <path d="M88 330 L165 265 L230 315 L315 240 L424 335 L424 362 Q424 382 404 382 L108 382 Q88 382 88 362 Z" fill="#232b45" opacity="0.45" />

  <!-- Center Play Circle Ring -->
  <circle cx="256" cy="256" r="68" fill="#0f121d" fill-opacity="0.75" stroke="url(#frameGrad)" stroke-width="4" />

  <!-- Glowing Play Triangle -->
  <path d="M236 216 L300 256 L236 296 Z" fill="url(#playGrad)" stroke="url(#playGrad)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)" />
</svg>
